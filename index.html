<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanjo Rock — Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE6D6;
    --paper-dim:#E2D8C0;
    --ink:#211D15;
    --rust:#B14A2C;
    --moss:#4B5A3A;
    --gold:#A9822E;
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Lora', Georgia, serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.05;
    background-image:
      radial-gradient(circle at 20% 30%, #000 0, transparent 1px),
      radial-gradient(circle at 60% 70%, #000 0, transparent 1px),
      radial-gradient(circle at 80% 20%, #000 0, transparent 1px);
    background-size: 3px 3px, 5px 5px, 4px 4px;
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 20px 80px;
  }

  /* Masthead */
  header.masthead{
    padding:0;
    margin:0 -20px 0;
    background:var(--ink);
    line-height:0;
  }
  header.masthead img.logo{
    display:block;
    width:100%;
    max-width:420px;
    margin:0 auto;
  }
  .kicker-bar{
    background:var(--ink);
    padding:0 20px 24px;
    margin:0 -20px 0;
    text-align:center;
  }
  .kicker{
    font-family:'Lora', serif;
    font-style:italic;
    font-size:.9rem;
    color:#B7AE93;
    margin:0 0 6px;
  }
  .subtitle{
    margin:0;
    font-size:1rem;
    color:#D8D0B8;
  }
  @media (min-width:600px){
    header.masthead{ margin:0 -32px 0; }
    .kicker-bar{ margin:0 -32px 0; padding:0 32px 28px; }
  }
  .rule{
    border:none;
    border-top:3px solid var(--ink);
    margin:22px 0 0;
  }
  .rule.thin{
    border-top:1px solid #C9BE9F;
  }

  /* Next event banner */
  .next-event{
    margin-top:22px;
    padding:18px 0;
    border-bottom:1px solid #C9BE9F;
  }
  .next-event .label{
    font-size:.78rem;
    letter-spacing:.06em;
    color:var(--rust);
    margin:0 0 6px;
    font-family:'Lora', serif;
    font-weight:600;
  }
  .next-event .what{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:1.5rem;
    margin:0 0 4px;
    line-height:1.15;
  }
  .next-event .when{
    font-size:.95rem;
    color:#4A4437;
    margin:0;
  }

  /* Filters */
  nav.filters{
    display:flex;
    gap:18px;
    margin:26px 0 6px;
    flex-wrap:wrap;
  }
  nav.filters button{
    background:none;
    border:none;
    padding:4px 0;
    font-family:'Lora', serif;
    font-size:.92rem;
    color:#6b6350;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav.filters button.active{
    color:var(--ink);
    border-bottom-color:var(--rust);
  }

  /* Feed */
  .feed{
    margin-top:8px;
  }
  article.post{
    padding:28px 0;
    border-bottom:1px solid #C9BE9F;
  }
  article.post:first-of-type{
    padding-top:20px;
  }
  .meta{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:8px;
    font-size:.82rem;
  }
  .meta .date{
    color:#6b6350;
  }
  .meta .cat{
    color:var(--paper);
    background:var(--moss);
    padding:1px 8px;
    border-radius:2px;
    font-size:.72rem;
    letter-spacing:.02em;
  }
  .meta .cat[data-cat="novedades"]{ background:var(--rust); }
  .meta .cat[data-cat="historia"]{ background:var(--moss); }
  .meta .cat[data-cat="bandas"]{ background:var(--gold); }

  h2.post-title{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:1.7rem;
    line-height:1.05;
    margin:0 0 10px;
  }
  .post-image{
    width:100%;
    display:block;
    margin:0 0 14px;
  }
  .excerpt{
    margin:0 0 10px;
    color:#3a3527;
  }
  .post-body{
    display:none;
    margin-top:10px;
  }
  .post-body p{ margin:0 0 12px; }
  .post-body.open{ display:block; }

  .toggle{
    background:none;
    border:none;
    padding:0;
    font-family:'Lora', serif;
    font-style:italic;
    font-size:.92rem;
    color:var(--rust);
    cursor:pointer;
  }

  footer{
    margin-top:40px;
    padding-top:20px;
    border-top:3px solid var(--ink);
    font-size:.82rem;
    color:#6b6350;
  }

  /* Merch */
  section.merch{
    margin-top:44px;
    padding-top:28px;
    border-top:3px solid var(--ink);
  }
  .merch h2.section-title{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:2rem;
    margin:0 0 6px;
  }
  .merch .section-sub{
    margin:0 0 22px;
    font-size:.92rem;
    color:#4A4437;
  }
  .merch-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px 16px;
  }
  .merch-item{
    display:flex;
    flex-direction:column;
  }
  .merch-item .thumb{
    width:100%;
    aspect-ratio:1/1;
    background:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--paper);
    font-family:'Anton', sans-serif;
    font-size:1rem;
    text-align:center;
    padding:10px;
    line-height:1.1;
  }
  .merch-item .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .merch-item .name{
    margin:10px 0 2px;
    font-family:'Lora', serif;
    font-weight:600;
    font-size:.98rem;
  }
  .merch-item .price{
    margin:0;
    color:var(--rust);
    font-size:.92rem;
  }
  .merch-item .note{
    margin:2px 0 0;
    font-size:.78rem;
    color:#6b6350;
  }
  @media (min-width:600px){
    .merch-grid{ grid-template-columns:repeat(3, 1fr); }
  }

  /* Sponsors */
  section.sponsors{
    margin-top:44px;
    padding-top:28px;
    border-top:3px solid var(--ink);
  }
  .sponsors h2.section-title{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:2rem;
    margin:0 0 6px;
  }
  .sponsors .section-sub{
    margin:0 0 22px;
    font-size:.92rem;
    color:#4A4437;
  }
  .sponsors-list{
    display:flex;
    flex-direction:column;
    gap:0;
  }
  .sponsor-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:16px 0;
    border-bottom:1px solid #C9BE9F;
    text-decoration:none;
    color:inherit;
  }
  .sponsor-item .logo{
    width:64px;
    height:64px;
    flex:none;
    background:var(--paper-dim);
    border:1px solid #C9BE9F;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .sponsor-item .logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .sponsor-item .logo span{
    font-family:'Anton', sans-serif;
    font-size:.7rem;
    text-align:center;
    color:#6b6350;
    padding:4px;
    line-height:1.1;
  }
  .sponsor-item .info .name{
    font-family:'Lora', serif;
    font-weight:600;
    font-size:1rem;
    margin:0 0 2px;
  }
  .sponsor-item .info .tagline{
    font-size:.86rem;
    color:#4A4437;
    margin:0;
  }

  /* Materiales */
  section.materiales{
    margin-top:44px;
    padding-top:28px;
    border-top:3px solid var(--ink);
  }
  .materiales h2.section-title{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:2rem;
    margin:0 0 6px;
  }
  .materiales .section-sub{
    margin:0 0 18px;
    font-size:.92rem;
    color:#4A4437;
  }
  .materiales ul{
    margin:0;
    padding-left:20px;
  }
  .materiales li{
    margin:0 0 8px;
    font-size:.96rem;
  }

  @media (min-width:600px){
    .wrap{ padding:0 32px 80px; }
  }
</style>
</head>
